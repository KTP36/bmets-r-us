<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Results | MedSkillBuilder</title><style>body{font:16px system-ui;background:#edf3f8;color:#12355b;margin:0;padding:24px}main{max-width:1100px;margin:auto}input,button{font:inherit;padding:12px;border:1px solid #9baebd;border-radius:8px}button{background:#12355b;color:white;cursor:pointer}section{background:white;padding:24px;border-radius:16px}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}.scroll{overflow:auto}#status{min-height:24px}</style><main><h1>Private CBET results</h1><p>Latest 200 submissions · Client-reported scores, not independently verified</p><section><form id="login"><label for="token">Admin access token</label> <input id="token" type="password" autocomplete="off" required minlength="32"> <button>Load results</button> <button id="logout" type="button">Clear</button></form><p id="status" role="status">Enter your private token to load results. It is not saved in this browser.</p><div class="scroll"><table><thead><tr><th>Date</th><th>Username</th><th>Activity</th><th>Score</th><th>Percent</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">
const form=document.querySelector('#login'),token=document.querySelector('#token'),rows=document.querySelector('#rows'),status=document.querySelector('#status');let generation=0;
document.querySelector('#logout').onclick=()=>{generation++;token.value='';rows.replaceChildren();status.textContent='Results cleared.';};
form.onsubmit=async e=>{e.preventDefault();const g=++generation;rows.replaceChildren();status.textContent='Loading…';try{const r=await fetch('/api/results',{headers:{Authorization:'Bearer '+token.value},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Access denied. Check your token.':'Results unavailable. Check backend setup.');const data=await r.json();if(g!==generation)return;for(const x of data){const tr=document.createElement('tr');for(const v of [new Date(x.created_at).toLocaleString(),x.username,x.activity,x.score+'/'+x.total,x.percent+'%',x.time_seconds===null?'Not recorded':Math.floor(x.time_seconds/60)+':'+String(Math.floor(x.time_seconds%60)).padStart(2,'0')]){const td=document.createElement('td');td.textContent=v;tr.append(td);}rows.append(tr);}status.textContent=data.length?data.length+' results loaded.':'No results yet.';}catch(err){if(g===generation)status.textContent=err.message;}};
</script></html>
