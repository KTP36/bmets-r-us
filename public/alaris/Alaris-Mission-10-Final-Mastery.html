<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission 10 | MedSkillBuilder</title><style> *{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#172c40;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}header{background:#12364c;color:white;padding:24px;border-radius:14px}h1{margin:0;font-size:28px}section{background:white;padding:24px;margin-top:18px;border-radius:14px;border:1px solid #d4e0e8}button{font:inherit;border:1px solid #9cb0bd;background:white;color:#17394d;padding:12px 16px;border-radius:8px;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.55;cursor:default}.primary{background:#12646c;color:white;border-color:#12646c}.option{display:block;width:100%;text-align:left}.selected{border:2px solid #12646c;background:#e5f4f4}.feedback{background:#edf5f7;padding:16px;margin-top:16px;border-radius:8px}progress{width:100%;height:14px;accent-color:#12646c}img{max-width:100%;max-height:300px;display:block;margin:auto}small{color:#506675}#cert{text-align:center;border:6px double #12646c;padding:32px} @media print{body{background:white}header,#stats,#panel button,#notice{display:none}section{border:0}main{max-width:none}}</style><nav id="msb-return" aria-label="Academy navigation"><a href="/?tab=CBETAcademy&amp;alaris=1">← Return to Alaris Academy</a><span id="msb-save-status" role="status"></span></nav><main><header><small style="color:#c4e4e6">MEDSKILLBUILDER · BIOMED ACADEMY</small><h1>Mission 10 — Alaris System Mastery</h1>Final assessment · 50 questions</header><section id="stats"><div id="status"></div><progress id="progress" max="50" value="0"></progress></section><section id="panel"></section><section id="notice"><small>MEDSKILLBUILDER · ALARIS TRAINING</small></section></main><script>window.academyComplete=function(score){const mission=10;try{const key='medskillbuilder-alaris-progress-v1';const p=JSON.parse(localStorage.getItem(key)||'{}');if(!Array.from({length:mission-1},(_,i)=>i+1).every(n=>p[n]?.complete===true))throw Error('Complete earlier missions first.');if(mission===10&&(!Number.isInteger(score)||score<0||score>50))throw Error('Invalid final score.');if(!p[mission]?.complete){p[mission]={complete:true,date:new Date().toISOString(),...(mission===10?{firstScore:score}:{})};localStorage.setItem(key,JSON.stringify(p));}const status=document.getElementById('msb-save-status');if(status)status.textContent='Mission progress saved.';}catch(e){const status=document.getElementById('msb-save-status');if(status)status.textContent='Progress not saved: '+e.message;}};window.academyEligible=()=>false;const originalComplete=window.academyComplete;window.academyComplete=function(score){originalComplete(score);queueMicrotask(()=>{const panel=document.getElementById('panel');if(!panel)return;panel.querySelector('#msb-completion-actions')?.remove();const nav=document.createElement('div');nav.id='msb-completion-actions';nav.style.cssText='display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 8px;align-items:center';let saved=false;try{const p=JSON.parse(localStorage.getItem('medskillbuilder-alaris-progress-v1')||'{}');saved=Array.from({length:10},(_,j)=>j+1).every(n=>p[n]?.complete===true);}catch(e){}function link(text,url,primary){const a=document.createElement('a');a.textContent=text;a.href=url;a.style.cssText='display:inline-block;padding:14px 18px;border-radius:9px;font-weight:700;text-decoration:none;color:'+(primary?'#082032':'#e0f2fe')+';background:'+(primary?'#67e8f9':'#173653');nav.append(a);}if(saved)link('Return to Academy to claim certificate →','/?tab=CBETAcademy&alaris=1',true);else{const msg=document.createElement('p');msg.textContent='Progress could not be saved or earlier missions are incomplete. Return to the academy to check your progress.';nav.append(msg);}link('Return to Alaris Academy','/?tab=CBETAcademy&alaris=1',false);const retry=[...panel.querySelectorAll('button')].find(b=>/retake|restart/i.test(b.textContent));if(retry)retry.before(nav);else panel.append(nav);});};</script><script>const Q=[{"cat": "8015 | Intermittent loss of AC power", "p": "Nursing reports intermittent switching to battery while the 8015 is plugged into a wall outlet. On the bench, the technician verifies outlet operation and duplicates the reported loss of AC input. Inspection reveals cord damage near the strain relief. The damaged cord is removed from use.\n\nWhich corrective action is best supported by the inspection?", "o": ["Replace the damaged cord with an approved replacement and verify AC operation.", "Replace the power supply and retain the cord for testing.", "Replace the battery and repeat runtime testing.", "Replace the AC indicator board."], "e": "The damaged external component is the first supported fault. A battery transition alone does not establish power supply failure.", "img": null}, {"cat": "8015 | Intermittent loss of AC power", "p": "Nursing reports intermittent switching to battery while the 8015 is plugged into a wall outlet. On the bench, the technician verifies outlet operation and duplicates the reported loss of AC input. Inspection reveals cord damage near the strain relief. The damaged cord is removed from use.\n\nWith a replacement cord, AC operation is stable. What now?", "o": ["Verify stable AC operation, charging and AC-to-battery transition; complete applicable electrical safety and functional tests.", "Release after confirming the AC indicator.", "Perform battery capacity testing only.", "Replace the power supply as a precaution."], "e": "Restored AC operation resolves the symptom but does not replace required safety and functional checks.", "img": null}, {"cat": "8015 | Premature battery failure", "p": "Battery installed six months ago. AC operation normal. Approved capacity test fails; a compatible known-good battery passes in the same unit.\n\nWhich repair is supported?", "o": ["Replace the failed battery with an approved assembly.", "Replace the charger because the battery is relatively new.", "Replace the power supply and reuse the battery.", "Reset battery history and release."], "e": "The substitution isolates the battery more strongly than its age or charge indication.", "img": null}, {"cat": "8015 | Premature battery failure", "p": "Battery installed six months ago. AC operation normal. Approved capacity test fails; a compatible known-good battery passes in the same unit.\n\nWhat evidence is needed after replacement?", "o": ["Applicable battery, charging and system verification results.", "A normal charge indicator alone.", "A record of the battery installation date only.", "A passing AC power-on test only."], "e": "Verify the relevant functions under applicable manufacturer requirements; do not assume a new battery passes.", "img": null}, {"cat": "8100 | Recurrent downstream occlusion", "p": "On the bench with a compatible set and no restriction, the downstream alarm recurs. Authorized diagnostics show upstream PASS and downstream FAIL. Further authorized fault isolation confirms a defective downstream sensor.\n\nWhich repair is best supported?", "o": ["Replace the confirmed defective downstream sensor.", "Replace both pressure sensors as a matched pair without further evidence.", "Replace the upstream sensor because it monitors the supply.", "Replace the pumping mechanism based on the alarm alone."], "e": "The failed channel test narrows the fault; subsequent fault isolation confirms the sensor itself. Replace the confirmed failed component using applicable documentation.", "img": null}, {"cat": "8100 | Recurrent downstream occlusion", "p": "On the bench with a compatible set and no restriction, the downstream alarm recurs. Authorized diagnostics show upstream PASS and downstream FAIL. Further authorized fault isolation confirms a defective downstream sensor.\n\nAfter replacement, calibration reports success. What is still needed?", "o": ["Complete applicable repair-specific pressure and performance verification.", "Release because calibration succeeded.", "Repeat upstream diagnostics only.", "Clear event history and release."], "e": "Calibration and verification are distinct. Consult the repair-specific testing matrix.", "img": null}, {"cat": "8100 | Air detection failure", "p": "Flow accuracy PASS; authorized air detection verification FAIL. Correct set and test setup confirmed; diagnostic evaluation isolates the air-in-line sensor.\n\nWhat is the supported repair?", "o": ["Replace the confirmed defective air-in-line sensor.", "Replace the motor controller based on the flow result.", "Replace the downstream pressure sensor.", "Repeat flow testing and retain the failed sensor."], "e": "The failed safety function is independently significant; the evidence identifies the sensor.", "img": null}, {"cat": "8100 | Air detection failure", "p": "Flow accuracy PASS; authorized air detection verification FAIL. Correct set and test setup confirmed; diagnostic evaluation isolates the air-in-line sensor.\n\nWhich release decision is appropriate?", "o": ["Hold until applicable air detection and post-repair tests pass.", "Release with a warning to observe tubing.", "Release after a second passing flow test.", "Release after the alarm speaker passes."], "e": "All required protective functions must be verified before release.", "img": null}, {"cat": "8100 | Dropped module", "p": "Reported drop. Housing intact. Door latch feels abnormal; power-on PASS.\n\nWhat is the next action?", "o": ["Hold out of service and evaluate latch, door and applicable impact-related functions.", "Replace the enclosure and release after power-on.", "Run flow accuracy only.", "Replace the pressure sensors based on impact history alone."], "e": "The abnormal latch and impact history warrant targeted inspection and applicable testing.", "img": null}, {"cat": "8100 | Dropped module", "p": "Reported drop. Housing intact. Door latch feels abnormal; power-on PASS.\n\nInspection confirms a broken rear latch feature. What next?", "o": ["Replace the confirmed defective latch as applicable and complete required mechanical, impact-related and performance tests.", "Replace the latch and release if the door closes.", "Replace the entire pump mechanism without testing.", "Document the defect for the next PM."], "e": "A repaired latch must be verified in the context of the applicable impact and repair requirements.", "img": null}, {"cat": "8110 | Syringe drive fault", "p": "Compatible syringe correctly loaded. Size detection PASS; force verification PASS; position verification FAIL repeatedly.\n\nWhere should diagnosis concentrate?", "o": ["Position sensing and associated drive mechanics.", "Pressure-disc sensing alone.", "Syringe size detection alone.", "PC Unit battery management."], "e": "The failed position result narrows the investigation but does not prove a specific component is defective.", "img": null}, {"cat": "8110 | Syringe drive fault", "p": "Compatible syringe correctly loaded. Size detection PASS; force verification PASS; position verification FAIL repeatedly.\n\nA qualified technician confirms a position-sensing component fault. What follows repair?", "o": ["Applicable calibration and independent position and repair-specific verification.", "Force testing alone.", "Pressure-disc calibration alone.", "A normal power-on check."], "e": "Use the applicable 8110 testing matrix to determine required calibration and verification.", "img": null}, {"cat": "8120 | Patient request failure", "p": "During authorized bench simulation with dose requests permitted, the original cord intermittently fails. A known-good compatible cord restores reliable request recognition; security lock passes.\n\nWhat is the supported repair?", "o": ["Replace the complete defective bolus cord assembly.", "Replace the module-side input board.", "Replace the security lock sensor.", "Replace the syringe drive assembly."], "e": "The controlled substitution supports cord failure, consistent with the field repair approach.", "img": null}, {"cat": "8120 | Patient request failure", "p": "During authorized bench simulation with dose requests permitted, the original cord intermittently fails. A known-good compatible cord restores reliable request recognition; security lock passes.\n\nWhat should be verified?", "o": ["Patient request function and all applicable post-repair requirements.", "Security lock alone.", "Flow accuracy alone.", "Cord appearance alone."], "e": "Verify the repaired function and any additional requirements in the applicable documentation.", "img": null}, {"cat": "System | Intermittent module disconnect", "p": "Two modules, tested separately at the same PC Unit interface, disconnect intermittently. Each operates normally on a compatible known-good bench system.\n\nWhat should be investigated?", "o": ["The suspect PC Unit mating IUI interface and retention.", "Both module logic boards first.", "Both module pressure sensors.", "The wireless network access point first."], "e": "The common interface is the strongest lead. Inspect and test before replacing parts.", "img": null}, {"cat": "System | Intermittent module disconnect", "p": "Two modules, tested separately at the same PC Unit interface, disconnect intermittently. Each operates normally on a compatible known-good bench system.\n\nInspection confirms damage to the suspect IUI connector. What is appropriate?", "o": ["Repair using approved documentation and verify communication and applicable system functions.", "Replace both modules and leave the damaged connector.", "Clean the connector and release despite confirmed damage.", "Verify network IP assignment only."], "e": "Address the confirmed physical defect and verify the relevant system functions.", "img": null}, {"cat": "8015 | Network connectivity", "p": "Local functions pass. Network connection is reported unavailable; authorized check confirms no IP assignment.\n\nWhat is the best initial approach?", "o": ["Verify connectivity, reboot under approved conditions, recheck IP assignment and coordinate with authorized network support.", "Replace the wireless module immediately.", "Replace the main logic board immediately.", "Close the work order because local functions pass."], "e": "Missing IP assignment alone does not establish a hardware fault.", "img": null}, {"cat": "8015 | Network connectivity", "p": "Local functions pass. Network connection is reported unavailable; authorized check confirms no IP assignment.\n\nConnectivity is restored after authorized network support resolves the issue. What now?", "o": ["Verify required communication and applicable system functions; document the resolution.", "Replace the wireless module anyway.", "Record only that the unit powers on.", "Change unrelated network settings."], "e": "Document the actual resolution and verify the intended function without unnecessary changes.", "img": null}, {"cat": "8015 | Electrical safety and release", "p": "Simulated readings for the grounded 8015 PC Unit: ground 0.50 ohm; leakage 285 \u00b5A. Applicable test configuration and setup verified.\n\nHow should these readings be classified?", "o": ["Ground fails; leakage passes under the stated exercise limits.", "Both pass because ground is at the limit.", "Ground passes; leakage fails.", "Both fail."], "e": "Equality is not below the stated ground limit. Leakage is below the stated leakage limit.", "img": null}, {"cat": "8015 | Electrical safety and release", "p": "Simulated readings for the grounded 8015 PC Unit: ground 0.50 ohm; leakage 285 \u00b5A. Applicable test configuration and setup verified.\n\nAfter corrective action, ground is 0.18 ohm and leakage 110 \u00b5A, but another required test is missing. What is the disposition?", "o": ["Hold until all applicable tests are completed and documented.", "Release because both electrical readings pass.", "Release and defer the missing test to annual PM.", "Repeat leakage only and release."], "e": "Passing electrical safety does not substitute for missing required performance verification.", "img": null}, {"cat": "Diagnostic evidence and event history", "p": "Simulated record: three intermittent channel disconnects; two occurred during transport. Bench operation is currently normal.\n\nWhich investigation best addresses the evidence?", "o": ["Inspect mating IUI interfaces and retention, compare on a compatible known-good bench system, and review history.", "Replace the PC Unit logic board based on the repeated disconnects.", "Run flow accuracy tests only and close the ticket if they pass.", "Replace the affected module without evaluating the mating interface."], "e": "Transport correlation suggests an intermittent connection but does not prove it. Controlled comparison and inspection narrow the fault.", "img": null}, {"cat": "8015 power and battery", "p": "Simulated results: AC operation normal; charging indication present; battery runtime fails approved capacity test; known-good battery passes in same unit.\n\nWhat is the best supported repair decision?", "o": ["Replace the failed battery with an approved assembly and complete required verification.", "Replace the charging circuit because the original battery failed.", "Replace the AC input assembly and repeat the capacity test.", "Retain the original battery because charging indication is normal."], "e": "The controlled substitution supports battery failure. Verify the repaired system using applicable requirements.", "img": null}, {"cat": "8100 pressure sensing", "p": "Simulated bench record: compatible set correctly installed; no restriction; upstream diagnostic PASS; downstream diagnostic FAIL on repeat.\n\nWhich action is justified?", "o": ["Isolate and replace the confirmed failed downstream sensor, then perform required calibration and verification.", "Replace both sensors because they share a pumping channel.", "Replace the pumping mechanism because the alarm is downstream.", "Clear the alarm history and perform only a flow test."], "e": "The failed diagnostic supports targeted repair, not replacement of unrelated parts. Follow the applicable repair-specific testing matrix.", "img": null}, {"cat": "Flow accuracy with IDA-5", "p": "Simulated exercise: programmed 100 mL/h; measured 94 mL/h. Training-only acceptance band \u00b15%; not an Alaris specification.\n\nWhat is the correct interpretation?", "o": ["\u22126% error; outside the exercise limit; investigate setup and repeat per procedure before deciding on repair.", "\u22126% error; acceptable because the measured rate is close to the programmed rate.", "+6% error; outside the exercise limit; replace the pressure sensor.", "\u22124% error; acceptable under the exercise limit."], "e": "(94\u2212100)/100 \u00d7100 = \u22126%. A failed flow result does not identify a specific defective component.", "img": null}, {"cat": "Air detection and safety systems", "p": "Simulated record: flow PASS; pressure PASS; air-in-line functional test FAIL twice after setup confirmed.\n\nWhat is the appropriate disposition?", "o": ["Hold the module out of service, isolate the air detection fault and complete required tests after repair.", "Release the module because flow and pressure results pass.", "Replace the pumping mechanism without further fault isolation.", "Repeat only the pressure test and release if it passes."], "e": "A failed safety function prevents release. Identify the defective subsystem before repair.", "img": null}, {"cat": "8110 and 8120 force and position", "p": "Simulated 8110 results: syringe size PASS; position FAIL; force PASS; pressure-disc test PASS.\n\nWhat is the strongest next step?", "o": ["Investigate the position sensing and drive subsystem using approved diagnostics before selecting a part.", "Replace the pressure-disc sensor because it monitors delivery.", "Replace the force sensor because the plunger is involved.", "Perform only flow verification and release if acceptable."], "e": "The evidence points to position-related evaluation; it does not yet identify the exact failed part.", "img": null}, {"cat": "8120 patient dose request", "p": "Simulated results: original handset intermittent; known-good handset consistently passes; security door test passes.\n\nWhat repair is supported?", "o": ["Replace the complete defective bolus cord and complete applicable functional verification.", "Replace the module input board and retain the original cord.", "Replace the security lock sensor and repeat the dose request test.", "Replace the handset and input board together."], "e": "The substitution isolates the cord. Do not bypass programmed safety limits or use a patient-connected device for testing.", "img": null}, {"cat": "Electrical safety", "p": "Simulated results: earth resistance 0.50 \u03a9; leakage 285 \u00b5A.\n\nHow should these results be classified under the exercise limits?", "o": ["Earth fails, leakage passes; hold for investigation and repeat required tests.", "Both pass because resistance equals the limit.", "Earth passes, leakage fails because leakage approaches the limit.", "Both fail because either reading near its limit is automatically a failure."], "e": "The exercise uses strict less-than limits. Equality fails the resistance criterion; 285 is below 300.", "img": null}, {"cat": "Calibration versus verification", "p": "Simulated repair record: downstream sensor replaced; calibration completed; required pressure verification not yet performed.\n\nWhat should happen next?", "o": ["Perform the required independent verification and remaining repair-specific tests before release.", "Release the module because calibration completed successfully.", "Repeat calibration until two consecutive successful messages appear, then release.", "Perform only electrical safety testing because the sensor is new."], "e": "Calibration and verification serve different purposes. Use the applicable testing matrix and document actual results.", "img": null}, {"cat": "Network connectivity and authorized access", "p": "Simulated record: local device operation normal; after approved reboot, no IP assignment confirmed.\n\nWhich response is most appropriate?", "o": ["Verify approved connectivity and coordinate authorized network diagnostics before deciding on hardware replacement.", "Replace the wireless module immediately because no IP is assigned.", "Replace the PC Unit logic board and repeat delivery testing.", "Close the ticket because local infusion functions pass."], "e": "Missing IP assignment does not establish hardware failure. Escalate through authorized channels without bypassing controls.", "img": null}, {"cat": "Dropped equipment", "p": "Simulated record: 8100 dropped; housing intact; power-on PASS; latch movement feels abnormal.\n\nWhat is the appropriate next action?", "o": ["Hold out of service, inspect mechanical retention and safety mechanisms, and perform required impact-related tests.", "Release after a normal power-on test and visual inspection.", "Replace the housing and release without further mechanical tests.", "Run flow accuracy only because the housing is intact."], "e": "The abnormal latch and impact history require evaluation beyond visual inspection and power-on.", "img": null}, {"cat": "Integrated return-to-service decision", "p": "Simulated record: 8120 cord replaced; request function PASS; lock PASS; required post-repair test documentation incomplete.\n\nWhat is the best disposition?", "o": ["Keep the device out of service until required tests are completed and documented.", "Release because the original complaint has been resolved.", "Release with a note to complete the remaining tests at the next PM.", "Replace the handset again to ensure the repair is reliable."], "e": "Release depends on completion of all applicable requirements, not only resolution of the original complaint.", "img": null}, {"cat": "Equipment identification", "p": "Identify the pictured device.", "o": ["8120 PCA module", "8110 syringe module", "8100 large volume pump", "8015 PC Unit"], "e": "The PCA module includes a patient dose request cord and security door.", "img": "pca"}, {"cat": "Equipment identification", "p": "Which component is pictured?", "o": ["8100 pressure sensor reference", "8015 battery assembly", "8110 syringe barrel clamp", "8120 dose request handset"], "e": "Pressure sensing helps detect restrictions; confirm the exact part revision before ordering.", "img": "pressure"}, {"cat": "Equipment identification", "p": "Which component is pictured?", "o": ["8110 pressure sensor board assembly", "8015 wireless board", "8100 motor controller", "8120 dose request cord"], "e": "The 8110 pressure sensing subsystem is distinct from plunger force sensing.", "img": "board"}, {"cat": "8015", "p": "A PC Unit is completely unresponsive on AC. Outlet and cord are verified. Which subsystem should be evaluated next?", "o": ["Input protection and power conversion using authorized procedures", "Wireless communication and IP acquisition", "Module pressure sensing and calibration", "Battery history alone"], "e": "Follow the power chain; inspect applicable fuses and power circuitry per documentation.", "img": null}, {"cat": "8015", "p": "A two-year battery replacement interval is used in one department. How should it be applied elsewhere?", "o": ["Follow local policy and applicable manufacturer requirements", "Apply two years as a universal manufacturer limit", "Replace only after a charging alarm", "Use installation date instead of capacity testing"], "e": "The two-year interval is local practice, not a universal specification.", "img": null}, {"cat": "8015", "p": "The AC indicator is normal but the unit has poor battery runtime. What does the indicator establish?", "o": ["AC input is indicated; battery capacity still requires evaluation", "Battery capacity has passed", "Charging current is necessarily correct", "The battery is the only possible fault"], "e": "AC indication and usable battery capacity are distinct.", "img": null}, {"cat": "8100", "p": "An upstream occlusion alarm occurs with a kink between the bag and pump. What is the best interpretation?", "o": ["A real upstream restriction can explain the alarm", "Downstream sensor failure is confirmed", "The pumping mechanism is necessarily defective", "The upstream sensor requires replacement"], "e": "Eliminate genuine restrictions before diagnosing sensing hardware.", "img": null}, {"cat": "8100", "p": "A door closes but its latch is visibly damaged. Flow accuracy passes. What is the disposition?", "o": ["Hold for mechanical repair and applicable verification", "Release based on flow accuracy", "Calibrate pressure and release", "Replace the air sensor before inspecting the latch"], "e": "Mechanical retention is independent of delivery accuracy.", "img": null}, {"cat": "8100", "p": "Which function is associated with the safety clamp sensing system?", "o": ["Monitoring the applicable administration-set safety mechanism", "Measuring battery capacity", "Assigning the PC Unit network address", "Measuring syringe plunger position"], "e": "Safety clamp detection is distinct from flow and pressure measurement.", "img": null}, {"cat": "8100", "p": "The pumping mechanism is suspected after a flow failure. What evidence is needed before replacing it?", "o": ["Verified test setup and fault isolation supporting a mechanism defect", "One out-of-range measurement regardless of setup", "A normal downstream pressure reading alone", "An alarm history reset"], "e": "Flow failure alone does not isolate a component.", "img": null}, {"cat": "8110 / 8120", "p": "Which subsystem tracks syringe drive travel?", "o": ["Position sensing subsystem", "Wireless communication subsystem", "Air-in-line detector", "AC input protection"], "e": "Position feedback relates to drive travel, distinct from force sensing.", "img": null}, {"cat": "8110 / 8120", "p": "What does plunger force sensing evaluate?", "o": ["Force associated with syringe plunger drive", "AC protecti document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const label=b.textContent.trim();const submit=/^submit (answer|decision)/i.test(label);const nav=/start|continue|next|previous|back|begin|retake|retry|view results|complete station|review briefing|review stations/i.test(label)&&!b.matches('.option,.choices button')||b.id==='guideNext'||b.id==='guideBack';if(!submit&&!nav)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{sync();if(submit){move(feedback()||content());}else{const actions=document.querySelector('.msb-station-actions');if(visible(actions)&&(b.id==='guideNext'||b.id==='guideBack')&&visible(document.querySelector('.layout'))){const r=actions.getBoundingClientRect();if(r.top>=12&&r.bottom<=window.innerHeight-12)return;if(window.innerWidth>850){move(actions);return;}}move(content());}}));},true);
